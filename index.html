<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Open Graph -->
  <meta property="og:title"       content="ECHOS">
  <meta property="og:description" content="An atmospheric sound world. Walk, listen, explore.">
  <meta property="og:type"        content="website">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>ECHOS</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      background:#000; width:100%; height:100%;
      overflow:hidden; touch-action:none;
    }
    #c {
      display:block; cursor:none;
      position:relative; z-index:1;
      width:100vw; height:100vh;
    }

    /* ── Overlay ── */
    #overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.96);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      color:rgba(255,255,255,0.90);
      font-family:'Cinzel','Palatino Linotype',serif;
      letter-spacing:0.35em;
      z-index:10; user-select:none;
    }
    #overlay h1 {
      font-size:clamp(20px,6vw,32px);
      font-weight:700; letter-spacing:0.50em;
      margin-bottom:24px;
    }
    #overlay .subtitle {
      font-size:clamp(9px,2.5vw,11px); opacity:0.45;
      font-family:'Cinzel',serif; letter-spacing:0.28em;
      margin-bottom:36px;
    }

    /* ── Progress bar ── */
    #progress-wrap {
      width: clamp(160px, 38vw, 280px);
      margin-bottom: 28px;
    }
    #progress-bar-track {
      width:100%; height:1px;
      background:rgba(200,185,150,0.15);
      position:relative; overflow:hidden;
    }
    #progress-bar-fill {
      height:100%; width:0%;
      background:rgba(200,185,150,0.65);
      transition:width 0.3s ease;
    }
    #progress-label {
      font-family:'Cinzel',serif;
      font-size:8px; letter-spacing:0.28em;
      color:rgba(200,185,150,0.38);
      text-align:center; margin-top:8px;
    }

    /* ── Begin button ── */
    #begin-btn {
      font-family:'Cinzel',serif;
      font-size:clamp(9px,2.5vw,11px);
      letter-spacing:0.28em;
      color:rgba(200,185,150,0.55);
      opacity:0; cursor:pointer;
      transition:opacity 0.6s ease;
      padding:10px 0;
      background:none; border:none;
    }
    #begin-btn.ready { opacity:1; }

    /* Starfield */
    #starfield { display:block; }
  </style>
</head>
<body>

<div id="overlay">
  <canvas id="starfield" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.55;"></canvas>

  <h1 style="position:relative;">E C H O S</h1>
  <p class="subtitle" style="position:relative;">a sound world</p>

  <div id="progress-wrap" style="position:relative;">
    <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
    <div id="progress-label">loading · 0%</div>
  </div>

  <button id="begin-btn">touch or click to begin</button>
</div>

<canvas id="c"></canvas>

<script>
// ── Starfield ──────────────────────────────────────────────────────────────────
(function () {
  const oc = document.getElementById('starfield');
  const resize = () => { oc.width = window.innerWidth; oc.height = window.innerHeight; };
  resize(); window.addEventListener('resize', resize);
  const ox = oc.getContext('2d');
  const stars = Array.from({ length: 180 }, () => ({
    x: Math.random(), y: Math.random(),
    r: 0.4 + Math.random() * 1.2,
    op: 0.15 + Math.random() * 0.55,
    ph: Math.random() * Math.PI * 2,
    sp: 0.004 + Math.random() * 0.012,
  }));
  function tickStars() {
    if (!document.getElementById('overlay') || document.getElementById('overlay').style.display === 'none') return;
    ox.clearRect(0, 0, oc.width, oc.height);
    stars.forEach(s => {
      s.ph += s.sp;
      const a = s.op * (0.5 + 0.5 * Math.sin(s.ph));
      ox.fillStyle = `rgba(210,200,170,${a})`;
      ox.beginPath(); ox.arc(s.x * oc.width, s.y * oc.height, s.r, 0, Math.PI * 2); ox.fill();
    });
    requestAnimationFrame(tickStars);
  }
  tickStars();
})();

// ── Volume defaults (used by world audio) ─────────────────────────────────────
window._COSMOS_VOL = { world: 0.38, fires: 0.48, bubbles: 0.65 };
</script>

<script type="module">
import { Engine }        from './engine/Engine.js';
import { WorldOne }      from './worlds/world_01.js';
import { TouchControls } from './engine/TouchControls.js';
import { Heatmap }       from './engine/Heatmap.js';

// ── Resonance Audio (optional, fail silently) ──────────────────────────────────
await new Promise(resolve => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/resonance-audio/build/resonance-audio.min.js';
  s.onload = resolve; s.onerror = resolve;
  document.head.appendChild(s);
});

// ── Build world + engine ───────────────────────────────────────────────────────
const world  = new WorldOne();
const engine = new Engine('c');
engine.loadWorld(world);

// ── Heatmap + TouchControls (global so world_01 can reach them) ────────────────
window._heatmap       = new Heatmap();
window._touchControls = new TouchControls();
window._input         = engine.input;

// ── Progress bar — track all media elements created by WorldBase ───────────────
const bar   = document.getElementById('progress-bar-fill');
const label = document.getElementById('progress-label');
const btn   = document.getElementById('begin-btn');

function watchProgress() {
  // Collect all HTMLMediaElements in the document after world load
  const els = Array.from(document.querySelectorAll('audio, video'));
  if (els.length === 0) { finishProgress(); return; }

  let loaded = 0;
  const total = els.length;

  const onReady = () => {
    loaded = Math.min(total, els.filter(e =>
      e.readyState >= 3 || e.error || e.networkState === 3
    ).length);
    const pct = Math.round(loaded / total * 100);
    bar.style.width   = pct + '%';
    label.textContent = `loading · ${pct}%`;
    if (pct >= 100) finishProgress();
  };

  els.forEach(el => {
    el.addEventListener('canplaythrough', onReady, { once: true });
    el.addEventListener('error',          onReady, { once: true });
  });

  // Poll as fallback (some elements may already be ready)
  const poll = setInterval(() => {
    onReady();
    if (loaded >= total) clearInterval(poll);
  }, 400);

  // Minimum load time so bar is visible even on fast connections
  setTimeout(finishProgress, 1800);
}

function finishProgress() {
  bar.style.width   = '100%';
  label.textContent = 'ready';
  btn.classList.add('ready');
}

// Give WorldBase time to create media elements, then watch
setTimeout(watchProgress, 120);

// ── Start on tap / click / keydown ────────────────────────────────────────────
let started = false;
function startGame() {
  if (started) return;
  started = true;
  const overlay = document.getElementById('overlay');
  if (overlay) overlay.style.display = 'none';
  engine.start();
}

document.getElementById('overlay').addEventListener('click',    startGame, { once: true });
document.getElementById('overlay').addEventListener('touchend', startGame, { once: true });
document.addEventListener('keydown', startGame, { once: true });
</script>

<script>
// ── Service Worker ─────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js', { scope: './' })
    .then(reg => reg.update()).catch(() => {});
}
</script>
</body>
</html>
